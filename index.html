<body>

  <h1>?? Ecommerce SERIES - Angie</h1>

  <div id="productos"></div>

  <div class="carrito">
    <h2>?? Carrito de Compras (0)</h2>

    <ul id="lista-carrito"></ul>

    <p class="total">
      <strong>Total: $<span id="total">0.00</span></strong>
    </p>

    <button class="vaciar" onclick="vaciarCarrito()">
      ?? Vaciar Carrito
    </button>
  </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "Stranger Things",
        precio: 25.00,
        imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8_XqeGzDbbByb8pnNe4rUzHmi7H1Qwod4fFmo3AxiOw&s=10"
      },
      {
        id: 2,
        nombre: "The Walking Dead",
        precio: 18.00,
        imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIm1YuTv7p2qiPCDfWXple815cuofw0D5RKd0mIxB5LA&s=10"
      },
      {
        id: 3,
        nombre: "Juegos de Tronos",
        precio: 30.00,
        imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWe67qIonix33mTm4xZlqtr187_pf3XbCd6EFOF9ZTuQ&s=10"
      },
      {
        id: 4,
        nombre: "Bojack Horseman",
        precio: 18.00,
        imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRshmFIUIZDy2YBPTH2uJiBY9KBoRZbnI1R9T7LO1OvA&s=10"
      },
      {
        id: 5,
        nombre: "You",
        precio: 22.00,
        imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYnW4ESmg8AaY0wGvK-Yrg8Nl6m_8845CvswDiyjik3g&s=10"
      }
    ];

    const carrito = [];

    const contenedorProductos = document.getElementById("productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const totalCarrito = document.getElementById("total");

    function mostrarProductos() {
      productos.forEach(prod => {

        const div = document.createElement("div");

        div.className = "producto";

        div.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">
          <h3>${prod.nombre}</h3>
          <p>Precio: $${prod.precio.toFixed(2)}</p>

          <button onclick="agregarAlCarrito(${prod.id})">
            ?? Agregar al carrito
          </button>
        `;

        contenedorProductos.appendChild(div);
      });
    }

    function agregarAlCarrito(id) {

      const productoExistente = carrito.find(p => p.id === id);

      if (productoExistente) {

        productoExistente.cantidad++;

      } else {

        const producto = productos.find(p => p.id === id);

        carrito.push({
          ...producto,
          cantidad: 1
        });
      }

      actualizarCarrito();
    }

    function actualizarCarrito() {

      listaCarrito.innerHTML = "";

      let total = 0;
      let totalItems = 0;

      carrito.forEach(item => {

        const li = document.createElement("li");

        li.textContent =
          `${item.nombre} x${item.cantidad} - $${(
            item.precio * item.cantidad
          ).toFixed(2)}`;

        listaCarrito.appendChild(li);

        total += item.precio * item.cantidad;

        totalItems += item.cantidad;
      });

      totalCarrito.textContent = total.toFixed(2);

      actualizarTituloCarrito(totalItems);
    }

    function actualizarTituloCarrito(cantidad) {

      const titulo = document.querySelector(".carrito h2");

      titulo.textContent =
        `?? Carrito de Compras (${cantidad})`;
    }

    function vaciarCarrito() {

      if (confirm("¿Estás seguro de que quieres vaciar el carrito?")) {

        carrito.length = 0;

        actualizarCarrito();
      }
    }

    function finalizarCompra() {

      if (carrito.length === 0) {

        alert(
          "El carrito está vacío. Agrega productos antes de finalizar la compra."
        );

        return;
      }

      alert(
        "?? ¡Gracias por tu compra! En breve recibirás un correo de confirmación."
      );

      carrito.length = 0;

      actualizarCarrito();
    }

    const botonFinalizar = document.createElement("button");

    botonFinalizar.textContent = "? Finalizar Compra";

    botonFinalizar.className = "finalizar";

    botonFinalizar.onclick = finalizarCompra;

    document.querySelector(".carrito").appendChild(botonFinalizar);

    mostrarProductos();
  </script>

</body>
</html>
